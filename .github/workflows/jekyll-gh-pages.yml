# 🚀 Jekyll Portfolio Deployment Workflow
# Automatically build & deploy your Jekyll site to GitHub Pages
name: "✨ Deploy Portfolio on GitHub Pages"

# Trigger workflow on pushes to main OR manually via Actions tab
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Ensure only one deployment runs at a time
concurrency:
  group: "portfolio-pages"
  cancel-in-progress: false

jobs:
  # ------------------------
  # 1️⃣ Build Your Jekyll Site
  # ------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code 📂
        uses: actions/checkout@v4

      - name: Setup GitHub Pages 🛠️
        uses: actions/configure-pages@v5

      - name: Install Ruby & Jekyll Gems 💎
        run: |
          gem install bundler
          bundle install

      - name: Build Jekyll Site 🔨
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Site Artifact 📦
        uses: actions/upload-pages-artifact@v3

  # ------------------------
  # 2️⃣ Deploy to GitHub Pages
  # ------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🌐
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Celebrate Deployment 🎉
        run: echo "Your portfolio is live! Check it out at ${{ steps.deployment.outputs.page_url }}"
